<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entertainment - Kaleb's Portfolio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet" />
    <link href="/PortfolioWebPage/style.css?v=20260906-1704" rel="stylesheet" />
</head>
<body>
    <header id="global-nav"></header>

    <!-- Current wrapper for games and toys content. -->
    <main id="main" class="wrapper">
        <section id="entertainment-hub">
            <h2>Games</h2>
            <div class="card-grid">
                <button class="entry-card" data-view="tetris">
                    <div class="thumb thumb-tetris" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <span class="card-title">Tetris System</span>
                </button>
                <button class="entry-card" data-view="snake">
                    <div class="thumb thumb-snake" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <span class="card-title">Snake System</span>
                </button>
            </div>

            <h2>Toys</h2>
            <div class="card-grid">
                <button class="entry-card" data-view="toy">
                    <div class="thumb thumb-toy" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <span class="card-title">Array Grid Toy</span>
                </button>
            </div>
        </section>

        <div id="tetris-system" class="game-view" hidden>
            <button class="back-btn" data-back>&larr; Back to Entertainment</button>
            <h2>Tetris System</h2>
            <div id="tetris-controls">
                <p>Score: <span id="tetris-score">0</span> | Level: <span id="tetris-level">1</span></p>
                <button id="tetrisStartBtn">Initialize Matrix</button>
            </div>

            <div class="butMania" id="tetrisDisplay">
                </div>

            <!-- Touch controls. Hidden on pointer-precise devices by style.css,
                 since a keyboard is the better input where there is one. -->
            <div class="touch-pad touch-pad-row" aria-label="Tetris controls">
                <button type="button" class="pad-btn" data-action="left" aria-label="Move left">&larr;</button>
                <button type="button" class="pad-btn" data-action="up" aria-label="Rotate">&#8635;</button>
                <button type="button" class="pad-btn" data-action="down" aria-label="Soft drop">&darr;</button>
                <button type="button" class="pad-btn" data-action="right" aria-label="Move right">&rarr;</button>
            </div>
        </div>

        <div id="snake-system" class="game-view" hidden>
            <button class="back-btn" data-back>&larr; Back to Entertainment</button>
            <h2>Snake System</h2>
            <div id="game-controls">
                <p>Score: <span id="score">0</span></p>
                <select id="modeSelect">
                    <option value="classic">Classic</option>
                    <option value="donut">Donut</option>
                    <option value="infinity">Infinity</option>
                </select>
                <button id="startBtn">Start Game</button>
            </div>
            <div class="butMania is-snake" id="snakeDisplay">
                </div>

            <!-- Touch controls. Hidden on pointer-precise devices by style.css,
                 since a keyboard is the better input where there is one. -->
            <div class="touch-pad touch-pad-dpad" aria-label="Snake controls">
                <button type="button" class="pad-btn pad-up" data-action="up" aria-label="Up">&uarr;</button>
                <button type="button" class="pad-btn pad-left" data-action="left" aria-label="Left">&larr;</button>
                <button type="button" class="pad-btn pad-right" data-action="right" aria-label="Right">&rarr;</button>
                <button type="button" class="pad-btn pad-down" data-action="down" aria-label="Down">&darr;</button>
            </div>
        </div>

        <div id="toy-system" class="game-view" hidden>
            <button class="back-btn" data-back>&larr; Back to Entertainment</button>
            <h2>Array Grid Toy</h2>
            <p>Enter dimensions to generate a grid. Keep it under 100 for best performance.</p>

            <form id="arrayForm">
                <div>
                    <label for="xVal">Columns:</label>
                    <input type="number" id="xVal" min="1" max="200">
                </div>
                <div>
                    <label for="yVal">Rows:</label>
                    <input type="number" id="yVal" min="1" max="200">
                </div>
                <button type="submit">Generate Grid</button>
            </form>

            <div class="butMania" id="toyDisplay">
            </div>
        </div>
    </main>

    <footer id="global-footer" class="wrapper">
      <p id="last-updated"></p>
    </footer>

    <script src="/PortfolioWebPage/scripts/nav.js?v=20260906-1704"></script>
    <script src="/PortfolioWebPage/scripts/footer.js?v=20260906-1704"></script>
    <script type="module" src="./entertainment.js?v=20260906-1704"></script>
</body>
</html>
