<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entertainment - Kaleb's Portfolio</title>
    <!-- Vendored - see the note in index.html. -->
    <link href="/PortfolioWebPage/vendor/normalize.css?v=20260908-2022" rel="stylesheet" />
    <link href="/PortfolioWebPage/style.css?v=20260908-2022" rel="stylesheet" />
</head>
<body>
    <header id="global-nav"></header>

    <!-- Current wrapper for games and toys content. -->
    <main id="main" class="wrapper">
        <section id="entertainment-hub">
            <h2>Games</h2>
            <div class="card-grid">
                <button class="entry-card" data-view="tetris">
                    <div class="thumb thumb-tetris" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <span class="card-title">Falling Polyominos</span>
                </button>
                <button class="entry-card" data-view="snake">
                    <div class="thumb thumb-snake" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <span class="card-title">Snake</span>
                </button>
                <button class="entry-card" data-view="minesweeper">
                    <div class="thumb thumb-mines" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <span class="card-title">Mine Sweeper</span>
                </button>
            </div>

            <h2>Toys</h2>
            <div class="card-grid">
                <button class="entry-card" data-view="toy">
                    <div class="thumb thumb-toy" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <span class="card-title">Finger Paint</span>
                </button>
            </div>
        </section>

        <div id="tetris-system" class="game-view" hidden>
            <button class="back-btn" data-back>&larr; Back to Entertainment</button>
            <h2>Falling Polyominos</h2>
            <div id="tetris-controls">
                <p>Score: <span id="tetris-score">0</span> | Level: <span id="tetris-level">1</span></p>
                <button id="tetrisStartBtn">Initialize Matrix</button>
            </div>

            <div class="butMania" id="tetrisDisplay">
                </div>

            <!-- Touch controls. Hidden on pointer-precise devices by style.css,
                 since a keyboard is the better input where there is one. -->
            <div class="touch-pad touch-pad-row" aria-label="Falling Polyominos controls">
                <button type="button" class="pad-btn" data-action="left" aria-label="Move left">&larr;</button>
                <button type="button" class="pad-btn" data-action="up" aria-label="Rotate">&#8635;</button>
                <button type="button" class="pad-btn" data-action="down" aria-label="Soft drop">&darr;</button>
                <button type="button" class="pad-btn" data-action="right" aria-label="Move right">&rarr;</button>
            </div>
        </div>

        <div id="snake-system" class="game-view" hidden>
            <button class="back-btn" data-back>&larr; Back to Entertainment</button>
            <h2>Snake</h2>
            <div id="game-controls">
                <p>Score: <span id="score">0</span></p>
                <select id="modeSelect">
                    <option value="classic">Classic</option>
                    <option value="donut">Donut</option>
                    <option value="bridge">Bridge</option>
                    <option value="infinity">Infinity</option>
                </select>
                <button id="startBtn">Start Game</button>
            </div>
            <div class="butMania is-snake" id="snakeDisplay">
                </div>

            <!-- Touch controls. Hidden on pointer-precise devices by style.css,
                 since a keyboard is the better input where there is one. -->
            <div class="touch-pad touch-pad-dpad" aria-label="Snake controls">
                <button type="button" class="pad-btn pad-up" data-action="up" aria-label="Up">&uarr;</button>
                <button type="button" class="pad-btn pad-left" data-action="left" aria-label="Left">&larr;</button>
                <button type="button" class="pad-btn pad-right" data-action="right" aria-label="Right">&rarr;</button>
                <button type="button" class="pad-btn pad-down" data-action="down" aria-label="Down">&darr;</button>
            </div>
        </div>

        <div id="minesweeper-system" class="game-view" hidden>
            <button class="back-btn" data-back>&larr; Back to Entertainment</button>
            <h2>Mine Sweeper</h2>
            <div id="mine-controls">
                <p>Flags left: <span id="mine-count">12</span></p>
                <select id="mineModeSelect" aria-label="Board size">
                    <option value="standard">Standard (10x10)</option>
                    <option value="large">Large (20x20)</option>
                </select>
                <!-- Flagging needs a second gesture. Right-click covers a mouse, but a
                     touchscreen has no equivalent, so this toggle is the way in on a
                     phone - a mode you can see, rather than a long-press you have to
                     know about. -->
                <button type="button" id="flagToggle" aria-pressed="false">
                    <span class="flag-glyph" aria-hidden="true">&#9873;</span> Flag mode
                </button>
                <button type="button" id="mineStartBtn">New Game</button>
            </div>
            <p id="mine-status" role="status">Tap any square to begin.</p>

            <!-- Deliberately not .butMania: that class brings a rule for 30px
                 cells which out-specifies this board's own sizing. -->
            <div id="mineDisplay"></div>
        </div>

        <div id="toy-system" class="game-view" hidden>
            <button class="back-btn" data-back>&larr; Back to Entertainment</button>
            <h2>Finger Paint</h2>
            <p>Enter dimensions to generate a grid. Keep it under 100 for best performance.</p>

            <form id="arrayForm">
                <div>
                    <label for="xVal">Columns:</label>
                    <input type="number" id="xVal" min="1" max="200">
                </div>
                <div>
                    <label for="yVal">Rows:</label>
                    <input type="number" id="yVal" min="1" max="200">
                </div>
                <button type="submit">Generate Grid</button>
            </form>

            <div class="butMania" id="toyDisplay">
            </div>
        </div>

        <!-- Shown instead of a native alert() when a game ends. A browser dialog forces
             the mobile toolbar back on screen and resets the scroll position, which
             drags the nav bar into view and leaves the pad out of reach on the way back
             in. This is fixed to the viewport, so nothing moves underneath it. -->
        <div id="game-over" hidden>
            <div id="game-over-panel" role="alertdialog" aria-labelledby="game-over-message">
                <p id="game-over-message"></p>
                <p id="game-over-score"></p>
                <!-- Mirrors whichever mode select belongs to the game that just ended,
                     so a different mode can be chosen without leaving the dialog and
                     hunting for the control behind it. Populated at show time. -->
                <div id="game-over-mode" hidden>
                    <label for="game-over-mode-select" id="game-over-mode-label">Mode</label>
                    <select id="game-over-mode-select"></select>
                </div>
                <button type="button" id="play-again">Play Again</button>
                <button type="button" id="game-over-back" data-back>Back to Entertainment</button>
            </div>
        </div>
    </main>

    <footer id="global-footer" class="wrapper">
      <p id="last-updated"></p>
    </footer>

    <script src="/PortfolioWebPage/scripts/nav.js?v=20260908-2022"></script>
    <script src="/PortfolioWebPage/scripts/footer.js?v=20260908-2022"></script>
    <script src="/PortfolioWebPage/scripts/offline.js?v=20260908-2022"></script>
    <script type="module" src="./entertainment.js?v=20260908-2022"></script>
</body>
</html>
