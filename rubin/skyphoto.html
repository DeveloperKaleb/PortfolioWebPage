<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <title>Stars in your photo (test) - Kaleb's Portfolio</title>
    <!-- Sky photos, step 1 (NOTES.md, "Sky photos"): a test page, linked from nowhere yet.
         It finds the stars in a photo and names them (step 2, js/skysolve.js). The
         photo never leaves the phone: it is read and searched in this page. -->
    <meta name="robots" content="noindex" />
    <link href="/PortfolioWebPage/vendor/normalize.css?v=20261122-0102" rel="stylesheet" />
    <link href="/PortfolioWebPage/style.css?v=20261122-0102" rel="stylesheet" />
</head>
<body>
    <header id="global-nav"></header>
    <main id="main" class="wrapper rubin skyphoto">
        <h2>Stars in your photo</h2>
        <p class="rubin-subtitle">
            A test: take a photo of the night sky, outside after dark, and this page finds
            its stars and names them. Your photo stays on your phone; nothing is uploaded.
        </p>
        <p>
            <label class="skyphoto-pick" for="skyphoto-file">Choose or take a photo</label>
            <input id="skyphoto-file" type="file" accept="image/*" />
        </p>
        <p id="skyphoto-status" role="status" aria-live="polite"></p>
        <canvas id="skyphoto-canvas" hidden></canvas>
    </main>
    <script src="/PortfolioWebPage/scripts/nav.js?v=20261122-0102"></script>
